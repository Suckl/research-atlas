<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面已移动</title>
<script>
/* Old URLs: /tracks/... moved to /legacy/tracks/..., /papers/index.html became the site root. */
(function () {
  var p = location.pathname, base = p.indexOf("/research-atlas/") === 0 ? "/research-atlas/" : "/";
  var rest = p.slice(base.length);
  var to = null;
  if (rest.indexOf("tracks/") === 0) to = base + "legacy/" + rest;
  else if (rest === "papers/" || rest === "papers/index.html") to = base;
  if (to) location.replace(to + location.search + location.hash);
})();
</script>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:15vh auto;padding:0 20px;color:#333}</style>
</head><body><h1>页面不存在</h1><p>这个地址可能已经移动。<a id="to-home">回到论文书架</a> · <a id="to-legacy">旧版研究路线</a></p>
<script>(function(){var b=location.pathname.indexOf("/research-atlas/")===0?"/research-atlas/":"/";document.getElementById("to-home").href=b;document.getElementById("to-legacy").href=b+"legacy/index.html";})();</script></body></html>
